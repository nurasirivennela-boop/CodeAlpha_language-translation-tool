<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌐 Language Translation Tool</h1>
        <p class="subtitle">
            Translate text easily between different languages.
        </p>

        <div class="translator">

            <!-- Language Selection -->
            <div class="language-row">

                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="te">Telugu</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                </select>

                <button id="swapButton" type="button">
                    ⇄
                </button>

                <select id="targetLanguage">
                    <option value="hi">Hindi</option>
                    <option value="en">English</option>
                    <option value="te">Telugu</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="it">Italian</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                </select>

            </div>

            <!-- Text Areas -->
            <div class="text-boxes">

                <div class="text-box">

                    <textarea
                        id="inputText"
                        placeholder="Enter text here..."
                    ></textarea>

                    <div class="buttons">
                        <button id="clearButton" type="button">
                            Clear
                        </button>

                        <button id="speakButton" type="button">
                            🔊 Speak
                        </button>
                    </div>

                </div>


                <div class="text-box">

                    <textarea
                        id="outputText"
                        placeholder="Translation will appear here..."
                        readonly
                    ></textarea>

                    <div class="buttons">

                        <button id="copyButton" type="button">
                            📋 Copy
                        </button>

                    </div>

                </div>

            </div>

            <!-- Translate Button -->
            <button
                id="translateButton"
                class="translate-button"
                type="button"
            >
                Translate
            </button>

            <!-- Status -->
            <p id="status"></p>

        </div>

        <footer>
            <p>
                Built using HTML, CSS, JavaScript and MyMemory API
            </p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
                      </html>
